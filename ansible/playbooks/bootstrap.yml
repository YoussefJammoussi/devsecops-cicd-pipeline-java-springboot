---
- name: Bootstrap DevSecOps servers
  hosts: all
  become: yes

  tasks:

    - name: Update APT cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install basic dependencies
      apt:
        name:
          - curl
          - wget
          - git
          - unzip
          - python3
        state: present
